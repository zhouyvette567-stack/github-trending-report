<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📰 2026-08-28 - AI新闻锐评日报</title>
  <meta name="description" content="AI锐评每日机器之心AI新闻">
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #f0883e;
      --accent2: #58a6ff;
      --green: #3fb950;
      --purple: #a371f7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .nav {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-brand span { color: var(--purple); }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a {
      color: var(--text-secondary);
      font-size: 14px;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .nav-links a:hover { color: var(--text); text-decoration: none; }
    .nav-links a.active { color: var(--purple); border-bottom-color: var(--purple); }

    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

    .date-header {
      text-align: center;
      margin: 32px 0 24px;
    }
    .date-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .date-header .meta {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .summary-card {
      background: linear-gradient(135deg, #1a1e2e 0%, #161b22 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
      font-size: 16px;
      line-height: 1.8;
    }
    .summary-card .label {
      font-size: 12px;
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .news-card:hover {
      border-color: var(--purple);
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }
    .news-rank {
      font-size: 24px;
      font-weight: 800;
      color: var(--purple);
      min-width: 36px;
    }
    .news-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    .news-title a { color: inherit; }
    .news-title a:hover { color: var(--accent2); text-decoration: none; }
    
    .news-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .review-box {
      background: rgba(163, 113, 247, 0.08);
      border-left: 3px solid var(--purple);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.7;
    }
    .review-label {
      font-size: 11px;
      color: var(--purple);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(88, 166, 255, 0.1);
      color: var(--accent2);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 8px;
    }

    .history-list { list-style: none; }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .history-date {
      font-size: 18px;
      font-weight: 600;
      min-width: 120px;
    }
    .history-link {
      font-size: 14px;
      color: var(--accent2);
    }

    .footer {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-secondary);
      font-size: 13px;
      border-top: 1px solid var(--border);
      margin-top: 48px;
    }

    @media (max-width: 640px) {
      .nav { flex-direction: column; gap: 12px; }
      .news-header { flex-direction: column; }
      .container { padding: 16px 12px; }
    }
  </style>
</head>

    </div>
  </nav>
  <div class="container">

      <div class="meta">
        📅 2026-08-28 · 数据更新于 2026/8/28 09:31:37

      <div class="source-badge" style="margin-top:12px;">
        🔗 数据来源：<a href="https://www.jiqizhixin.com/" target="_blank">机器之心</a>
      </div>
    </div>
    <div class="summary-card">
      <div class="label">📝 今日热点总评</div>
      <div>今日AI行业依然精彩纷呈，各大厂商你追我赶！</div>
    </div>  </div>
  <footer class="footer">
    <p>🤖 AI新闻锐评日报 · 数据来源 <a href="https://www.jiqizhixin.com/" target="_blank">机器之心</a> · AI锐评由 <a href="https://github.com/marketplace/models" target="_blank">GitHub Models</a> 生成</p>

  </footer>
</body>
